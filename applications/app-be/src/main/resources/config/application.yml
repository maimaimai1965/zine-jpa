    shutdown: graceful
management:
    endpoints:
        web:
            exposure:
                include: "*"

    kafka:
        bootstrap-servers: kafka:9092
        listener:
            # Как подтверждается обработка сообщения consumer-а (KafkaListenerContainerFactory):
            ack-mode: manual
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            # Сколько подтверждений нужно от брокеров перед тем как считать сообщение отправленным:
            acks: 1
