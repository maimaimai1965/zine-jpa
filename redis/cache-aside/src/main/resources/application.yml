server:
  port: 8080

spring:
  application:
    name: redis-example
  config:
    activate:
      on-profile: default
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none        # отключен
#      ddl-auto: validate    # только проверка
#      ddl-auto: update      # создаёт недостающие таблицы
#      ddl-auto: create      # пересоздаёт схему
#      ddl-auto: create-drop # удаляет при shutdown
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
