logging:
    level:
        ROOT: INFO
server:
    port: 8089
#    servlet:
#        session:
#            cookie:
#                http-only: true
#    forward-headers-strategy: FRAMEWORK
#    tomcat:
#        additional-tld-skip-patterns: "*"
spring:
    mvc:
        problemdetails:
            enabled: true
    main.banner-mode: off
    main:
        allow-bean-definition-overriding: true
    lifecycle.timeout-per-shutdown-phase: 9s
    application:
        name: zine Kafka Consumer Application
    messages:
        basename: i18n/messages
    shutdown: graceful

    kafka:
        bootstrap-servers: localhost:9092
        listener:
            # Как подтверждается обработка сообщения consumer-а (KafkaListenerContainerFactory):
            ack-mode: manual
        consumer:
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            group-id: product-create-group
#            auto-offset-reset: earliest
#            enable-auto-commit: false
            properties.spring.json.trusted.packages: ua.mai.zine.kafka.event # "*"
#                "[spring.json.value.default.type]": "io.maksymdobrynin.async.kafka.api.ChargeRequest"
#                partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor

zine:
    kafka:
        product-create-topic:
            name: product-create-topic
            partitions: 3

management:
    endpoints:
        web:
            exposure:
                include: "*"

