# Docker stack name
name: zine-kafka-stack

# Kafka: INTERNAL — порт 9092 только внутри Docker-сети (kafka:9092).
# EXTERNAL — порт 29092 в контейнере, на хосте тоже 29092 (${EXTERNAL_KAFKA_HOST:-localhost}:29092).

services:

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      # EXTERNAL: с хоста и из LAN (bootstrap = ${EXTERNAL_KAFKA_HOST:-localhost}:29092).
      - "29092:29092"
      # INTERNAL (9092) на хост не пробрасываем — только для сервисов в compose-сети.
      # CONTROLLER (KRaft)
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL — producer/consumer/ui в Docker: kafka: (порт 9092 в контейнере).
      # EXTERNAL — клиенты снаружи; в metadata — EXTERNAL_KAFKA_HOST:29092.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${EXTERNAL_KAFKA_HOST:-localhost}:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - zine-kafka-net

  zine-kafka-producer-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-producer
    container_name: zine-kafka-producer-app
    ports:
      - "8088:8088"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_ADDRESS: 0.0.0.0

      # Чтобы видеть больше логов при проблемах с Kafka
      LOGGING_LEVEL_ORG_APACHE_KAFKA: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA: DEBUG

      # Увеличить таймауты, если нужно
      SPRING_KAFKA_PRODUCER_PROPERTIES_REQUEST_TIMEOUT_MS: 30000
      SPRING_KAFKA_PRODUCER_PROPERTIES_DELIVERY_TIMEOUT_MS: 60000
    depends_on:
      - kafka
#        condition: service_healthy
    networks:
      - zine-kafka-net

  zine-kafka-consumer-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-consumer
    container_name: zine-kafka-consumer-app
    ports:
      - "8089:8089"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://zine-kafka-postgres:5432/zine-kafka
    depends_on:
      - kafka
      - zine-kafka-postgres
    networks:
      - zine-kafka-net

  zine-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: zine-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - zine-kafka-net

  zine-kafka-postgres:
    image: postgres:17-alpine
    container_name: zine-kafka-postgres
    restart: unless-stopped            # автоматически перезапускается при падении
    environment:
      POSTGRES_DB: zine-kafka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db/01-create-schema.sql:/docker-entrypoint-initdb.d/01-create-schema.sql   # создание схемы
    networks:
      - zine-kafka-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d zine-kafka" ]   # ← проверяем нужную БД
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s # даём время на запуск при первой инициализации
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  kafka-data:
  pgdata:

networks:
  zine-kafka-net:
    driver: bridge

